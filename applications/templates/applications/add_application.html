<!DOCTYPE html>
<html>
<head>

    <title>Add Application</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .form-container {
            max-width: 600px;
            margin: 60px auto;
        }

        .form-card {
            border: none;
            border-radius: 20px;
            padding: 15px;
        }

        .form-title {
            color: #5b21b6;
            font-weight: bold;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 12px;
        }

        .btn-save {
            background: linear-gradient(90deg, #6a11cb, #2575fc);
            border: none;
            border-radius: 10px;
            padding: 10px 25px;
            color: white;
            font-weight: bold;
        }

        .btn-save:hover {
            opacity: 0.9;
        }

    </style>

</head>

<body>

<div class="container form-container">

    <div class="card form-card shadow-lg">

        <div class="card-body">

            <h2 class="text-center form-title mb-4">
                ➕ Add Job Application
            </h2>

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        🏢 Company Name
                    </label>

                    <input
                        type="text"
                        name="company_name"
                        class="form-control"
                        placeholder="Enter company name"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        💼 Job Position
                    </label>

                    <input
                        type="text"
                        name="job_position"
                        class="form-control"
                        placeholder="Enter job position"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        📅 Applied Date
                    </label>

                    <input
                        type="date"
                        name="applied_date"
                        class="form-control"
                        required>

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        📊 Status
                    </label>

                    <select
                        name="status"
                        class="form-select">

                        <option value="Applied">
                            🔵 Applied
                        </option>

                        <option value="Interview">
                            🟡 Interview
                        </option>

                        <option value="Selected">
                            🟢 Selected
                        </option>

                        <option value="Rejected">
                            🔴 Rejected
                        </option>

                    </select>

                </div>


                <div class="d-flex justify-content-between">

                    <a href="/"
                       class="btn btn-outline-secondary">
                        ← Back
                    </a>

                    <button
                        type="submit"
                        class="btn-save">

                        💾 Save Application

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
