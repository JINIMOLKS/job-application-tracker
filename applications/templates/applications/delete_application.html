<!DOCTYPE html>
<html>
<head>

    <title>Delete Application</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            min-height: 100vh;
        }

        .delete-container {
            max-width: 500px;
            margin: 120px auto;
        }

        .delete-card {
            border: none;
            border-radius: 20px;
        }

        .warning-icon {
            font-size: 55px;
        }

        .delete-title {
            color: #dc2626;
            font-weight: bold;
        }

        .btn-delete {
            border-radius: 10px;
            padding: 10px 25px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container delete-container">

    <div class="card delete-card shadow-lg">

        <div class="card-body text-center p-5">

            <div class="warning-icon">
                ⚠️
            </div>

            <h2 class="delete-title mt-3">
                Delete Application?
            </h2>

            <p class="text-muted mt-3">

                Are you sure you want to delete

                <strong>
                    {{ application.company_name }}
                </strong>

                application?

            </p>

            <form method="POST">

                {% csrf_token %}

                <a href="/"
                   class="btn btn-outline-secondary btn-delete me-2">
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-danger btn-delete">

                    🗑️ Yes, Delete

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
